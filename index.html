*{box-sizing:border-box}
html,body{margin:0;min-height:100%}

::selection{background:var(--red);color:#fff}
.hidden{display:none!important}
.card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px 24px 24px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.mark{display:block;width:44px;height:44px;margin-bottom:14px}
h1{font:700 28px/1.1 var(--display);margin:0 0 8px;text-wrap:balance}
p{margin:0 0 18px;color:var(--muted);font-size:15px}
label.pw{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.field{display:flex;border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden}
.field:focus-within{outline:2px solid var(--focus);outline-offset:1px}
.field input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:17px/1.2 var(--body);padding:13px 12px;outline:0;caret-color:var(--red)}
.field button{border:0;border-left:1px solid var(--line);background:transparent;color:var(--muted);font:700 13px/1 var(--body);padding:0 14px;cursor:pointer}
.field button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.err{color:var(--bad);font-size:14px;font-weight:700;margin:8px 0 0;min-height:1.2em}
.remember{display:flex;align-items:center;gap:10px;margin:12px 0 18px;font-size:15px;cursor:pointer}
.remember input{width:20px;height:20px;accent-color:var(--red);margin:0}
.go{width:100%;border:0;border-radius:10px;background:var(--btn);color:var(--btnInk);font:700 16px/1 var(--body);padding:15px;cursor:pointer}
.go:hover{opacity:.92}
.go:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.go[disabled]{opacity:.6;cursor:progress}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:3s}}
</style>
